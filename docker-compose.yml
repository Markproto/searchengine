# Profoundd uses host-specific compose files.
#
# Running `docker compose up` against this file is intentionally a no-op
# that prints an error — it exists to prevent the failure mode where a
# stale `docker compose -f docker-compose.prod.yml` (Apollo9-bound IPs)
# is run on Azure7 and silently fails to bind ports, leaving the mirror
# down for hours.
#
# Use the Makefile (`make help`) or pick a host file directly:
#   - docker-compose.apollo9.yml — production server (apollo9)
#   - docker-compose.azure7.yml  — hot-standby mirror (azure7)
#   - docker-compose.dev.yml     — local development

services:
  _do-not-use:
    image: alpine:3.19
    command:
      - sh
      - -c
      - >-
        echo "ERROR: docker-compose.yml is a stub. Use one of:" >&2;
        echo "  docker compose -f docker-compose.apollo9.yml up -d" >&2;
        echo "  docker compose -f docker-compose.azure7.yml up -d" >&2;
        echo "  docker compose -f docker-compose.dev.yml up -d" >&2;
        echo "Or run: make help" >&2;
        exit 1
