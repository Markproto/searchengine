{% extends "base.html" %}
{% block title %}Suggest a Source - Profoundd{% endblock %}

{% block content %}
<div class="container submit-page">
    <h1>Suggest a News Source</h1>
    <p class="submit-intro">Know a website we should be indexing? Just paste the link below. We'll handle the rest.</p>

    <form method="POST" action="/submit" class="source-form">
        <div class="form-group">
            <label for="url">Website URL</label>
            <input type="url" id="url" name="url" required placeholder="https://example.com" value="https://" class="submit-url-input">
        </div>

        <div class="form-group">
            <label for="reason">Why should we add this? <span class="text-muted">(optional)</span></label>
            <textarea id="reason" name="reason" rows="2" placeholder="e.g. Great independent journalism, covers topics others won't..."></textarea>
        </div>

        <div class="form-group">
            <label for="submitted_by">Your Name <span class="text-muted">(optional)</span></label>
            <input type="text" id="submitted_by" name="submitted_by" placeholder="Anonymous">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>
{% endblock %}
